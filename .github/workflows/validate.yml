name: Validate
run-name: "Validate ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install ropm modules
        run: npx ropm install

      - name: Validate (bsc type-check)
        run: npm run validate

      - name: Lint (bslint)
        continue-on-error: true   # racecar: scan/report/push step, must not fail the build
        run: npm run lint

      - name: Install example dependencies
        run: npm run prepare-examples

      - name: Validate examples (bsc type-check)
        run: npm run validate-examples

  ropm-consumer-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install ropm modules
        run: npx ropm install

      - name: Real ropm-install end-to-end check
        run: npm run test:ropm-consumer
